name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege default — every step here is read-only relative
# to the repo. release.yml separately declares `contents: write` for
# the GitHub Release publish step.
permissions:
  contents: read

jobs:
  ci:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aozora-obsidian
        uses: actions/checkout@v6
        with:
          path: aozora-obsidian

      - name: Checkout sibling aozora crate
        uses: actions/checkout@v6
        with:
          repository: P4suta/aozora
          path: aozora

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install just on the runner
        run: |
          curl -fsSL https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin --tag 1.36.0

      - name: Run full CI pipeline (check + wasm + test + build)
        working-directory: aozora-obsidian
        run: just ci

      - name: Upload built plugin artefacts
        uses: actions/upload-artifact@v7
        with:
          name: aozora-obsidian-plugin
          path: |
            aozora-obsidian/main.js
            aozora-obsidian/manifest.json
            aozora-obsidian/styles.css
            aozora-obsidian/aozora.wasm
          if-no-files-found: error
          retention-days: 14

      # bench is warn-only on shared GitHub runners — variance on
      # ubuntu-latest is too noisy for hard-fail thresholds. Numbers
      # are uploaded as a workflow artefact so trends can be reviewed
      # via `gh run download` and compared against bench/baseline.json.
      # Hard-fail graduation is roadmap "Now (v0.1.x)" after ≥30 days
      # of baseline data has accumulated. See bench/README.md and
      # docs/adr/0003-architecture-refresh-bench-first.md.
      - name: Run bench harness (warn-only)
        if: always()
        working-directory: aozora-obsidian
        continue-on-error: true
        run: just bench

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aozora-obsidian-bench
          path: |
            aozora-obsidian/bench/last-run.json
            aozora-obsidian/bench/baseline.json
          if-no-files-found: warn
          retention-days: 30

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@v1
